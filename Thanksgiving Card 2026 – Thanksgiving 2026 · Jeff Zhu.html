 13 L1 7 Z\" fill=\"none\" stroke=\"#B8934A\" stroke-width=\"1.2\"><\u002Fpath><\u002Fsvg>\n      <div style=\"width: 150px; height: 1px; background: linear-gradient(270deg, rgba(184,147,74,0), #B8934A)\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Shijing -->\n    <div style=\"margin-top: 46px; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 500; font-size: 36px; line-height: 50px; letter-spacing: 0.16em; color: #1B2A41;\">「投我以木桃，報之以瓊瑤。」<\u002Fdiv>\n    <div style=\"margin-top: 16px; font-style: italic; font-weight: 500; font-size: 30px; line-height: 40px; color: #1B2A41;\">\n      <div>You give me a peach of wood,<\u002Fdiv>\n      <div>I return you a precious jade.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 18px; font-family: 'Cormorant SC', 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px; line-height: 28px; letter-spacing: 0.1em; color: #1B2A41;\">— Book of Odes<span style=\"font-family: 'Noto Serif SC', serif; font-weight: 500; font-size: 20px; letter-spacing: 0.1em; margin-left: 16px;\">詩經·衛風·木瓜<\u002Fspan><\u002Fdiv>\n\n    <!-- divider -->\n    <div style=\"margin-top: 46px; display: flex; align-items: center; gap: 14px;\">\n      <div style=\"width: 150px; height: 1px; background: linear-gradient(90deg, rgba(184,147,74,0), #B8934A)\"><\u002Fdiv>\n      <svg aria-hidden=\"true\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\"><path d=\"M7 1 L13 7 L7 13 L1 7 Z\" fill=\"none\" stroke=\"#B8934A\" stroke-width=\"1.2\"><\u002Fpath><\u002Fsvg>\n      <div style=\"width: 150px; height: 1px; background: linear-gradient(270deg, rgba(184,147,74,0), #B8934A)\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- closing -->\n    <div style=\"margin-top: 46px; font-style: italic; font-weight: 500; font-size: 41px; line-height: 60px; color: #1B2A41;\">\n      <div>For those who bring light into our lives.<\u002Fdiv>\n      <div>For those who help our souls blossom.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- greeting -->\n    <div style=\"margin-top: 80px; font-family: 'Cormorant SC', 'Cormorant Garamond', serif; font-weight: 600; font-size: 52px; line-height: 58px; letter-spacing: 0.16em; color: #1B2A41; padding-left: 0.16em;\">Happy Thanksgiving<\u002Fdiv>\n    <div style=\"margin-top: 14px; display: flex; align-items: center; gap: 22px;\">\n      <div style=\"width: 120px; height: 1px; background: #B8934A\"><\u002Fdiv>\n      <div style=\"font-family: 'Cormorant SC', 'Cormorant Garamond', serif; font-weight: 600; font-size: 32px; line-height: 38px; letter-spacing: 0.4em; color: #96762F; padding-left: 0.4em;\">2026<\u002Fdiv>\n      <div style=\"width: 120px; height: 1px; background: #B8934A\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- signature -->\n  <div style=\"position: absolute; right: 70px; bottom: 80px; font-family: 'Mrs Saint Delafield', 'Pinyon Script', cursive; font-size: 84px; line-height: 90px; color: #1B2A41; transform: rotate(-4deg); white-space: nowrap;\">Jeff Zhu<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:1420}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
